name: L050110/dsh-vx-workbench
category: workflow
description:
  en: 'Repairs the CAD import path of Visual X-Space 4.8 by locating the decision branch from its byte signature instead of a fixed file offset, generates factory layouts from line parameters, and keeps a fingerprint-based skill ledger with an optional OpenViking catalog.'
  zh: '按字节特征定位（而非固定文件偏移）修复 Visual X-Space 4.8 的 CAD 导入判定分支，可按线体参数生成工厂布局，并维护基于指纹的技能台账（可选接入 OpenViking 目录）。'